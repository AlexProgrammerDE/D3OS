[package]
name = "d3os-compute"
version = "0.1.0"
edition = "2024"

[features]
nvidia = ["dep:d3os-nvidia", "dep:syscall"]

[dependencies]
d3os-tensor-file = { path = "../tensor-file" }
libm = "0.2"
d3os-nvidia = { path = "../nvidia", optional = true }
syscall = { path = "../syscall", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
