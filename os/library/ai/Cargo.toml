[package]
name = "d3os-ai"
version = "0.1.0"
edition = "2024"

[features]
default = []
cpu = ["burn/flex"]
training = ["burn/optim"]
native = ["dep:d3os-burn-native", "dep:burn-dispatch", "burn-dispatch/d3os-native"]

[dependencies]
crc32fast = { version = "=1.5.3", default-features = false }
burn-dispatch = { version = "=0.22.1", default-features = false, optional = true }
burn = { version = "=0.22.1", default-features = false, features = ["extension"] }
d3os-burn-native = { path = "../burn-native", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
concurrent = { path = "../concurrent" }
time = { path = "../time" }
embassy-time-driver = { version = "=0.2.2", features = ["tick-hz-1_000_000"] }
spin = "0.10"
