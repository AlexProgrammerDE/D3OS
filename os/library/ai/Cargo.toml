[package]
name = "d3os-ai"
version = "0.1.0"
edition = "2024"

[features]
default = []
cpu = ["burn/flex"]
training = ["burn/optim"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["extension"] }

[target.'cfg(target_os = "none")'.dependencies]
concurrent = { path = "../concurrent" }
time = { path = "../time" }
embassy-time-driver = { version = "=0.2.2", features = ["tick-hz-1_000_000"] }
spin = "0.10"
