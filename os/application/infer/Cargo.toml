[package]
name = "infer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]
path = "src/infer.rs"
test = false
doctest = false
bench = false

[dependencies]
d3os-tensor-file = { path = "../../library/tensor-file" }
crc32fast = { version = "=1.5.3", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
d3os-ai = { path = "../../library/ai", features = ["cpu", "training", "native"] }
runtime = { path = "../../library/runtime", features = ["burn"] }
terminal = { path = "../../library/terminal" }
naming = { path = "../../library/naming" }
logger = { path = "../../library/logger" }
time = { path = "../../library/time" }
syscall = { path = "../../library/syscall" }
d3os-compute = { path = "../../library/compute", features = ["nvidia"] }
d3os-nvidia = { path = "../../library/nvidia" }
log = "0.4"
libm = "0.2"
