name: Native inference

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pretrained:
        description: Verify pretrained AlexNet on the host and inside D3OS
        type: boolean
        default: false
      qwen:
        description: Verify pretrained Qwen3.5-0.8B on the host and inside D3OS
        type: boolean
        default: false

jobs:
  context-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install kernel verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential binutils gdb nasm dosfstools qemu-system-x86 ovmf
          cargo install --locked --no-default-features cargo-make --version 0.37.24
          cargo install --locked cargo-license --version 0.6.1
      - name: Verify QEMU vCPU affinity
        run: python3 tools/inference/test-vcpu-affinity.py
      - name: Verify scheduler inbox saturation and concurrent delivery
        run: |
          mkdir -p target
          rustc --edition=2024 --test tools/kernel/test-scheduler-inbox.rs -o target/test-scheduler-inbox
          target/test-scheduler-inbox
      - name: Build D3OS
        run: cargo make --no-workspace --profile production image
      - name: Inject an interrupt during a multicore context switch
        run: python3 tools/kernel/test-context-switch.py --accel tcg
      - name: Verify process exit stops workers on other cores
        run: python3 tools/kernel/test-process-exit.py --accel tcg --cpus 2 --repeat 30
      - name: Verify process exit stops sleeping workers
        run: python3 tools/kernel/test-process-exit.py --accel tcg --cpus 4 --repeat 30 --sleeping-workers --timeout 240
      - name: Verify Linux reservations, thread vector state, and cleanup handlers
        run: python3 tools/kernel/test-linux-threads.py --accel tcg --cpus 4 --memory-mib 512
      - name: Verify Burn timer tasks run on idle cores
        run: python3 tools/inference/test-qemu.py --burn-self-test --accel tcg --cpus 4 --repeat 10
      - name: Verify terminal input and process cleanup after a panic
        run: python3 tools/kernel/test-terminal-input.py --accel tcg --cpus 4 --repeat 30 --timeout 240
      - name: Verify PCI BAR enumeration with a virtual 16 GiB device
        run: python3 tools/inference/test-qemu.py --accel tcg --large-pci-bar --repeat 3
      - name: Upload kernel verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-switch-verification
          if-no-files-found: ignore
          path: |
            target/context-switch/*.log
            target/context-switch/check.gdb
            target/process-exit-tcg-2/*.log
            target/process-exit-tcg-4-sleeping/*.log
            target/linux-threads-tcg-4/*.log
            target/terminal-input-tcg-4/*.log
            target/terminal-input-tcg-4/failure.ppm
            target/inference-qemu-burn-self-test/*.log
            target/inference-qemu-self-test/serial.log
            target/inference-qemu-self-test/qemu.log
            target/inference-qemu-self-test/failure.gdb.log

  cpu-and-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify CPU operators and model loading
        run: >-
          cargo test --locked -p d3os-compute -p d3os-nvidia
          -p d3os-ai -p d3os-burn-native -p d3os-tensor-file -p linux-compat
          --features d3os-compute/nvidia,d3os-ai/cpu,d3os-ai/training,d3os-ai/native
      - name: Check compute and inference code
        run: >-
          cargo clippy --locked -p d3os-compute -p d3os-nvidia
          -p d3os-ai -p d3os-burn-native -p d3os-tensor-file -p linux-compat
          --features d3os-compute/nvidia,d3os-ai/cpu,d3os-ai/training,d3os-ai/native
          --all-targets -- -D warnings
      - name: Check the Linux MNIST reference without CUDA
        working-directory: tools/mnist-benchmark
        run: cargo clippy --locked --no-default-features --features cpu --all-targets -- -D warnings

      - name: Verify guest training artifact recovery
        run: python3 tools/nvidia/test-mnist.py
      - name: Verify MNIST numerical error measurements
        run: python3 tools/nvidia/test-mnist-comparison.py
      - name: Verify compiler profiling intervals
        run: python3 tools/nvidia/test-compiler-profile.py
      - name: Verify typed unary qualification gates
        run: python3 tools/nvidia/test-typed-unary.py
      - name: Verify typed trigonometric qualification gates
        run: python3 tools/nvidia/test-typed-trig.py
      - name: Verify quantized GPU counter reports
        run: python3 tools/nvidia/test-quantized-profile.py
      - name: Verify sharded GGUF firmware preparation
        run: python3 tools/nvidia/test-qwen-shards.py
      - name: Install model and OS build dependencies
        if: inputs.pretrained
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential nasm dosfstools qemu-system-x86 ovmf python3-numpy python3-pil
          cargo install --locked --no-default-features cargo-make --version 0.37.24
          cargo install --locked cargo-license --version 0.6.1
      - name: Prepare pretrained weights and independent reference outputs
        if: inputs.pretrained
        run: OPENBLAS_NUM_THREADS=2 python3 tools/inference/prepare-alexnet.py
      - name: Verify pretrained AlexNet on the host
        if: inputs.pretrained
        run: cargo run --locked -p d3os-ai --features cpu --example infer-host --release -- alexnet target/inference/alexnet.d3t target/inference/dog.d3t
      - name: Build D3OS
        if: inputs.pretrained
        run: cargo make --no-workspace --profile production image
      - name: Verify inference inside D3OS without GPU hardware
        if: inputs.pretrained
        run: |
          python3 tools/inference/test-qemu.py --accel tcg --timeout 300
          python3 tools/inference/test-qemu.py --accel tcg --alexnet --timeout 300
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inference-verification
          if-no-files-found: ignore
          path: |
            target/inference/manifest.json
            target/inference-qemu-*/serial.log
            target/inference-qemu-*/qemu.log

  cutile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gpu-kernels -> ../../target/cutile-build
      - name: Install cuTile host compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev
      - name: Compile and audit cuTile kernels without GPU hardware
        run: python3 tools/inference/test-cutile-kernels.py
      - name: Upload compiler verification records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutile-verification
          if-no-files-found: ignore
          path: |
            target/nvidia/kernels/manifest.json
            target/nvidia/kernels/*.json
            target/nvidia/kernels/host-audit/*.sass
            target/nvidia/kernels-failed-*/*.json
            target/nvidia/kernels-failed-*/*.sass

  qwen:
    if: github.event_name == 'workflow_dispatch' && inputs.qwen
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install OS and model verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential nasm dosfstools mtools util-linux fdisk qemu-system-x86 ovmf python3-venv
          cargo install --locked --no-default-features cargo-make --version 0.37.24
          cargo install --locked cargo-license --version 0.6.1
          python3 -m venv target/qwen-venv
          target/qwen-venv/bin/python -m pip install -r tools/inference/requirements-qwen.txt
      - name: Export Qwen text weights and independent Transformers fixtures
        run: target/qwen-venv/bin/python tools/inference/prepare-qwen.py
      - name: Verify native model and tokenizer against Transformers
        run: cargo run --locked -p d3os-ai --features cpu --example infer-host --release -- qwen-verify target/qwen
      - name: Build D3OS
        run: cargo make --no-workspace --profile production image
      - name: Verify Qwen inside D3OS with software CPU emulation
        run: |
          python3 tools/inference/test-qemu.py --accel tcg --qwen-verify --timeout 900
          python3 tools/inference/test-qemu.py --accel tcg --qwen --timeout 900
      - name: Upload Qwen verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen-verification
          if-no-files-found: ignore
          path: |
            target/qwen/manifest.json
            target/inference-qemu-qwen/serial-*.log
            target/inference-qemu-qwen/qemu.log
