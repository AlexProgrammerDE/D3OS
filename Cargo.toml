[workspace]
resolver = "2"
exclude = ["tools/gpu-kernels", "third_party/burn-optim", "third_party/burn-dispatch", "third_party/burn-backend-extension", "third_party/gemm-common", "third_party/burn-core", "third_party/cubecl-environment"]

members = [
    "os/application/doom",
    "os/application/infer",
    "os/kernel",
    "os/application/about",
    "os/application/hello",
    "os/application/helloc",
    "os/application/shell",
    "os/application/uptime",
    "os/application/date",
    "os/application/ls",
    "os/application/heaptest",
    "os/application/threadtest",
    "os/application/filetest",
    "os/application/nc",
    "os/application/ping",
    "os/application/ip",
    "os/application/peanut-gb",
    "os/application/pipetest",
    "os/application/ps",
     "os/application/window_manager",
    "os/application/terminal_emulator",
    "os/application/keytest",
    "os/application/netperf",
    "os/application/shmtest",
    "os/application/logtest",
    "os/application/httpd",
    "os/application/proctest",
    "os/application/cat",
    "os/application/avxtest",
]

[patch.crates-io]
burn-core = { path = "third_party/burn-core" }
cubecl-environment = { path = "third_party/cubecl-environment" }
burn-optim = { path = "third_party/burn-optim" }
burn-dispatch = { path = "third_party/burn-dispatch" }
burn-backend-extension = { path = "third_party/burn-backend-extension" }
gemm-common = { path = "third_party/gemm-common" }

# [profile.release]
# debug = true
